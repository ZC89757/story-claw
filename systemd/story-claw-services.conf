; supervisord 配置：自动拉起 ComfyUI + pipeline_wrapper + crash_monitor
; 放置位置：/etc/supervisor/conf.d/story-claw-services.conf
; 启动 supervisord 前需设置 STORY_CLAW_VISION_API_KEY，供 ComfyUI Gate 与 wrapper 共用
; 应用：supervisorctl reread && supervisorctl update

[program:comfyui]
command=/root/miniconda3/bin/python3.10 -u main.py --listen 0.0.0.0 --port 8188 --enable-manager --use-sage-attention
directory=/root/ComfyUI
environment=STORY_CLAW_VISION_API_KEY="%(ENV_STORY_CLAW_VISION_API_KEY)s"
priority=10
autostart=true
autorestart=true
startretries=5
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/root/ComfyUI/comfy.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true

[program:pipeline-wrapper]
command=/root/miniconda3/bin/python3.10 -u /root/pipeline_wrapper.py
directory=/root
environment=STORY_CLAW_VISION_API_KEY="%(ENV_STORY_CLAW_VISION_API_KEY)s",HTTP_PROXY="http://127.0.0.1:7890",HTTPS_PROXY="http://127.0.0.1:7890",http_proxy="http://127.0.0.1:7890",https_proxy="http://127.0.0.1:7890",NO_PROXY="127.0.0.1,localhost",no_proxy="127.0.0.1,localhost"
priority=20
autostart=true
autorestart=true
startretries=5
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/tmp/wrap.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:crash-monitor]
command=/root/miniconda3/bin/python3.10 -u /root/crash_monitor.py
directory=/root
priority=30
autostart=true
autorestart=true
startretries=10
startsecs=2
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/root/crash_capture/_supervisor_stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
