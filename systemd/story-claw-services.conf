; H3 uses native ComfyUI only. Install with scripts/setup_autostart.sh.
[program:story-claw-h3]
command=/bin/bash /root/story-claw/start-h3-service.sh
directory=/root
priority=10
autostart=true
autorestart=true
startretries=5
startsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/tmp/story-claw-h3.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true
